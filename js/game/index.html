<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>小游戏 | 肖航课题组</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#121212;color:white;font-family:Arial,sans-serif}
        h2{margin-bottom:15px}
        canvas{border:3px solid #0f9d58;background:#000}
        #score{font-size:22px;margin:10px 0}
    </style>
</head>
<body>
    <h2>贪吃蛇小游戏</h2>
    <div id="score">分数: 0</div>
    <canvas id="game" width="400" height="400"></canvas>

    <script>
        const canvas=document.getElementById("game");
        const ctx=canvas.getContext("2d");
        const scoreEl=document.getElementById("score");
        let grid=20,count=20;
        let snake=[{x:10*grid,y:10*grid}],dx=grid,dy=0;
        let food={x:15*grid,y:10*grid};
        let score=0;

        function draw(){
            ctx.fillStyle="#000";ctx.fillRect(0,0,canvas.width,canvas.height);
            ctx.fillStyle="#0f9d58";snake.forEach(s=>ctx.fillRect(s.x,s.y,grid-2,grid-2));
            ctx.fillStyle="#db4437";ctx.fillRect(food.x,food.y,grid-2,grid-2);
            scoreEl.innerText="分数: "+score;
        }

        function move(){
            let head={x:snake[0].x+dx,y:snake[0].y+dy};
            if(head.x<0||head.x>=canvas.width||head.y<0||head.y>=canvas.height||snake.some(s=>s.x===head.x&&s.y===head.y)){clearInterval(run);alert("游戏结束！最终得分："+score);window.location.reload();}
            snake.unshift(head);
            if(head.x===food.x&&head.y===food.y){score++;food={x:Math.floor(Math.random()*count)*grid,y:Math.floor(Math.random()*count)*grid};}
            else snake.pop();
        }

        document.addEventListener("keydown",e=>{
            if(e.key==="ArrowLeft"&&dx!==grid){dx=-grid;dy=0;}
            if(e.key==="ArrowUp"&&dy!==grid){dx=0;dy=-grid;}
            if(e.key==="ArrowRight"&&dx!==-grid){dx=grid;dy=0;}
            if(e.key==="ArrowDown"&&dy!==-grid){dx=0;dy=grid;}
        });

        let run=setInterval(()=>{draw();move();},100);
    </script>
</body>
</html>
